project: binformer-full
method: random

metric:
  name: val_loss
  goal: minimize

parameters:
  # Architecture
  hidden_dim:
    value: 256
  ffn_dim:
    value: 1024
  num_layers:
    value: 4
  num_heads:
    value: 8

  # Expression embedding
  expression_embedding:
    values: ["binned", "continuous"]
  num_bins:
    value: 50
  continuous_loss:
    values: ["mse", "poisson"]

  # Masking strategy
  masking_strategy:
    values: ["mask_token", "cls_bottleneck"]
  mask_ratio:
    values: [0.15, 0.35, 0.5, 0.75]

  # Optimizer
  learning_rate:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-3
  weight_decay:
    values: [1e-4, 0]
  warmup_epochs:
    value: 2

  # Sub-masking (mask_token only)
  mask_token_prob:
    values: [0.7, 0.8, 0.9]
  random_token_prob:
    value: 'auto'

command:
  - torchrun
  - --nnodes=1
  - --nproc_per_node=1
  - --rdzv_backend=c10d
  - --rdzv_endpoint=localhost:0
  - train.py
  - ${args}
